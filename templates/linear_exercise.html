<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Linear Algebra Exercise</title>
  
  <!-- Load CSS -->
  <link rel="stylesheet" type="text/css" href="../static/css/styles.css">

  <!-- MathJax Configuration  -->
  <script>
    MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']]
      },
      svg: {
        fontCache: 'global'
      }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <style>

    .page-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    .timer {
      font-size: 12px;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Logo Header -->
  <div style="text-align: center; margin-top: 2%; margin-bottom: 2%;"> 
    <img src="../static/Logo.png" width="50%" alt="Logo" />
  </div>

  <!-- Main Container -->
  <div class="page-container">  
    
    <h2 class="headingtop_margin">Exercises for Algebra</h2>
    
    <div class="exercise-box">
      <div class="timer" id="timer">
        <p>00:00:00</p>
      </div>
      <h4>Linear Equation</h4>

      <form id="exerciseForm">
        
        <!-- Question 1 -->
        <div id="Q1">
          <p class="line-spacing">Q1: \(x - 6 = 2x + 10\) </p>
          <input type="radio" id="lin1" name="q1" value="16">
          <label for="lin1">16</label><br>
          <input type="radio" id="lin2" name="q1" value="8">
          <label for="lin2">8</label><br>
          <input type="radio" id="lin3" name="q1" value="-16">
          <label for="lin3">-16</label><br>
          <p style="font-size: 14px;" id="resultMessage_q1"></p>
          
          <button type="button" class="button gray" onclick="checkAnswer('q1', '-16')">Check & Submit</button>
          <button type="button" class="button gray" id="submitButton1" onclick="showNextQuestionDiv('Q2', 'Q1')">Next Question</button>
        </div>

        <!-- Question 2 -->
        <div id="Q2" style="display: none;">
          <p class="line-spacing">Q2: \(7x - 20 = 4x + 4\) </p>
          <input type="radio" id="lin4" name="q2" value="8">
          <label for="lin4">8</label><br>
          <input type="radio" id="lin5" name="q2" value="18">
          <label for="lin5">18</label><br>
          <input type="radio" id="lin6" name="q2" value="14">
          <label for="lin6">14</label><br>
          <p style="font-size: 14px;" id="resultMessage_q2"></p>
          
          <button type="button" class="button gray" onclick="checkAnswer('q2', '8')">Check & Submit</button>
          <button type="button" class="button gray" id="submitButton2" onclick="showNextQuestionDiv('Q3', 'Q2')">Next Question</button>
        </div>

        <!-- Question 3 -->
        <div id="Q3" style="display: none;">
          <p class="line-spacing">Q3: \(34x - 6 = 22x + 8\) </p>
          <input type="radio" id="lin7" name="q3" value="3/7">
          <label for="lin7">3/7</label><br>
          <input type="radio" id="lin8" name="q3" value="7/6">
          <label for="lin8">7/6</label><br>
          <input type="radio" id="lin9" name="q3" value="6/7">
          <label for="lin9">6/7</label><br>
          <p style="font-size: 14px;" id="resultMessage_q3"></p>
          
          <button type="button" class="button gray" id="submitButton3" onclick="checkAnswer('q3', '7/6')">Check & Submit</button>
          <button type="submit" class="button gray" id="submitButton" onclick="checkAnswers(false)">Result</button>
          <br>
          <button type="button" class="button gray" id="exampleButton" disabled onclick="openPage('linear_example.html')">Example</button>
          <button type="button" class="button gray" id="nextButton" onclick="openPage('quadratic_exercise.html')" disabled>Next Exercise</button>
        </div>

      </form>
    </div>
    
    <div style="text-align: center; margin-top: 15px;"> 
      <p style="font-size:0.8em;">Note: You will get the final results based on your first attempt</p>
    </div>
  </div>

  <!-- Result Dialog -->
  <dialog id="resultDialog">
    <p id="resultMessage"></p>
    <button id="closeButton">Close</button>
  </dialog>

  <!-- Scripts -->
  <script>
    var evTypep = window.performance.getEntriesByType("navigation")[0].type;
  
    if (evTypep == 'reload') {
      var confirmationMessage = 'Refreshing this page will take you to the example page. Do you want to proceed?';
      var userConfirmed = window.confirm(confirmationMessage);
  
      if (!userConfirmed) {
        window.addEventListener('beforeunload', function (e) {
          e.preventDefault();
        });
      } else {
        window.location.replace('linear_example.html');
      }
    }
  </script>
 
  <script src="../static/script.js"></script>
</body>
</html>
