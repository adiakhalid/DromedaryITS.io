<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subtraction Exercise</title>
  
  <!-- Load CSS -->
  <link rel="stylesheet" type="text/css" href="../static/css/styles.css">

  <!-- MathJax Configuration  -->
  <script>
    MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']]
      },
      svg: {
        fontCache: 'global'
      }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <style>

    .page-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    .timer {
      font-size: 12px;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Logo Header -->
  <div style="text-align: center; margin-top: 2%; margin-bottom: 2%;"> 
    <img src="../static/Logo.png" width="50%" alt="Logo" />
  </div>
    
  <!-- Main Container -->
  <div class="page-container">  
    
    <h2 class="headingtop_margin">Exercises for Arithmetic</h2>
    
    <div class="exercise-box">
      <div class="timer" id="timer">
        <p>00:00:00</p>
      </div>
      <h4>Subtraction</h4>

      <form id="exerciseForm">
        
        <!-- Question 1 -->
        <div id="Q1">
          <p class="line-spacing">Q1: 18 - 7 = </p>
          <input type="radio" id="sub1" name="q1" value="12">
          <label for="sub1">12</label><br>
          <input type="radio" id="sub2" name="q1" value="15">
          <label for="sub2">15</label><br>
          <input type="radio" id="sub3" name="q1" value="11">
          <label for="sub3">11</label><br>
          <p style="font-size: 14px;" id="resultMessage_q1"></p>
          
          <button type="button" class="button gray" onclick="checkAnswer('q1', '11')">Check & Submit</button>
          <button type="button" class="button gray" id="submitButton1" onclick="showNextQuestionDiv('Q2', 'Q1')">Next Question</button>
        </div>

        <!-- Question 2 -->
        <div id="Q2" style="display: none;">
          <p class="line-spacing">Q2: 218 - 59 = </p>
          <input type="radio" id="sub4" name="q2" value="149">
          <label for="sub4">149</label><br>
          <input type="radio" id="sub5" name="q2" value="159">
          <label for="sub5">159</label><br>
          <input type="radio" id="sub6" name="q2" value="116">
          <label for="sub6">116</label><br>
          <p style="font-size: 14px;" id="resultMessage_q2"></p>
          
          <button type="button" class="button gray" onclick="checkAnswer('q2', '159')">Check & Submit</button>
          <button type="button" class="button gray" id="submitButton2" onclick="showNextQuestionDiv('Q3', 'Q2')">Next Question</button>
        </div>

        <!-- Question 3 -->
        <div id="Q3" style="display: none;">
          <p class="line-spacing">Q3: 507 - 135 = </p>
          <input type="radio" id="sub7" name="q3" value="357">
          <!-- Fixed label to match value -->
          <label for="sub7">357</label><br>
          <input type="radio" id="sub8" name="q3" value="389">
          <label for="sub8">389</label><br>
          <input type="radio" id="sub9" name="q3" value="372">
          <label for="sub9">372</label><br>
          <p style="font-size: 14px;" id="resultMessage_q3"></p>
          
          <button type="button" class="button gray" id="submitButton3" onclick="checkAnswer('q3', '372')">Check & Submit</button>
          <button type="submit" class="button gray" id="submitButton" onclick="checkAnswers(false)">Result</button>
          <br>
          <button type="button" class="button gray" id="exampleButton" disabled onclick="openPage('sub_example.html')">Example</button>
          <button type="button" class="button gray" id="nextButton" onclick="openPage('multiplication_Exercise.html')" disabled>Next Exercise</button>
        </div>

      </form>
    </div>
    
    <div style="text-align: center; margin-top: 15px;"> 
      <p style="font-size:0.8em;">Note: You will get the final results based on your first attempt</p>
    </div>
  </div>

  <!-- Result Dialog -->
  <dialog id="resultDialog">
    <p id="resultMessage"></p>
    <button id="closeButton">Close</button>
  </dialog>

  <!-- Scripts -->
  <script>
    var evTypep = window.performance.getEntriesByType("navigation")[0].type;
  
    if (evTypep == 'reload') {
      var confirmationMessage = 'Refreshing this page will take you to the example page. Do you want to proceed?';
      var userConfirmed = window.confirm(confirmationMessage);
  
      if (!userConfirmed) {
        window.addEventListener('beforeunload', function (e) {
          e.preventDefault();
        });
      } else {
        window.location.replace('sub_example.html');
      }
    }
  </script>
 
  <script src="../static/script.js"></script>
</body>
</html>
