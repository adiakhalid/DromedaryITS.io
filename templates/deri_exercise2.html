<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Derivative Exercise</title>
  
  <!-- Load CSS -->
  <link rel="stylesheet" type="text/css" href="../static/css/styles.css">

  <!-- MathJax Configuration  -->
  <script>
    MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']]
      },
      svg: {
        fontCache: 'global'
      }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <style>

    .page-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    .timer {
      font-size: 12px;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Logo Header -->
  <div style="text-align: center; margin-top: 2%; margin-bottom: 2%;"> 
    <img src="../static/Logo.png" width="50%" alt="Logo" />
  </div>
    
  <!-- Main Container -->
  <div class="page-container">  
    
    <h2 class="headingtop_margin">Exercises for Derivative</h2>
    
    <div class="exercise-box">
      <div class="timer" id="timer">
        <p>00:00:00</p>
      </div>
      <h4>Product and Trigonometric Rules</h4>

      <form id="exerciseForm">
        
        <!-- Question 1 -->
        <div id="Q1">
          <p class="line-spacing"> Q1: \(y = x^2\sin(x)\)  </p>
          <input type="radio" id="der1" name="q1" value="2xsin(x) + cos(x)">
          <label for="der1">\(2x\sin(x) + \cos(x)\)</label><br>
          
          <input type="radio" id="der2" name="q1" value="2xsin(x) + x^2cos(x)">
          <label for="der2">\(2x\sin(x) + x^2\cos(x)\)</label><br>
          
          <input type="radio" id="der3" name="q1" value="2xsin(x) + xcos(x)">
          <label for="der3">\(2x\sin(x) + x\cos(x)\)</label><br>
          
          <p style="font-size: 14px;" id="resultMessage_q1"></p>
          <button type="button" class="button gray" onclick="checkAnswer('q1', '2xsin(x) + x^2cos(x)')">Check & Submit</button>
          <button class="button gray" type="button" id="submitButton1" onclick="showNextQuestionDiv('Q2', 'Q1')">Next Question</button>
        </div>

        <!-- Question 2 -->
        <div id="Q2" style="display: none;">
          <p class="line-spacing">Q2: \(y = e^x\cos(x)\)</p>
          
          <input type="radio" id="der4" name="q2" value="e^xcos(x) + e^xsin(x)">
          <label for="der4">\(e^x\cos(x) + e^x\sin(x)\)</label><br>
          
          <input type="radio" id="der5" name="q2" value="e^xcos(x)">
          <label for="der5">\(e^x\cos(x) + e^x\)</label><br>
          
          <input type="radio" id="der6" name="q2" value="e^xcos(x) - e^xsin(x)">
          <label for="der6">\(e^x\cos(x) - e^x\sin(x)\)</label><br>
          
          <p style="font-size: 14px;" id="resultMessage_q2"></p>
          <button type="button" class="button gray" onclick="checkAnswer('q2', 'e^xcos(x) - e^xsin(x)')">Check & Submit</button>
          <button class="button gray" type="button" id="submitButton2" onclick="showNextQuestionDiv('Q3', 'Q2')">Next Question</button>
        </div>

        <!-- Question 3 -->
        <div id="Q3" style="display: none;">
          <p class="line-spacing">Q3: \(y = x^3\tan(x)\)  </p>
          
          <input type="radio" id="der7" name="q3" value="3x^2tan(x) + sec^2(x)">
          <label for="der7">\(3x^2\tan(x) + \sec^2(x)\)</label><br>
          
          <input type="radio" id="der8" name="q3" value="3x^2tan(x) + x^3sec^2(x)">
          <label for="der8">\(3x^2\tan(x) + x^3\sec^2(x)\)</label><br>
          
          <input type="radio" id="der9" name="q3" value="3xtan(x) + x^3sec^2(x)">
          <label for="der9">\(3x\tan(x) + x^3\sec^2(x)\)</label><br>
          
          <p style="font-size: 14px;" id="resultMessage_q3"></p>
          <button type="button" id="submitButton3" onclick="checkAnswer('q3', '3x^2tan(x) + x^3sec^2(x)')" class="button gray">Check & Submit</button>
          <button type="submit" id="submitButton" onclick="checkAnswers(true)" class="button gray">Result</button>
          <br>
          <button type="button" id="exampleButton" disabled onclick="openPage('deri_example2.html')" class="button gray">Example</button>
          <button class="button gray" type="button" id="nextButton" onclick="openPage('home.html')" disabled>Home Page</button>
        </div>

      </form>
    </div>
    
    <div style="text-align: center; margin-top: 15px;"> 
      <p style="font-size:0.8em;">Note: You will get the final results based on your first attempt</p>
    </div>
  </div>

  <!-- Result Dialog -->
  <dialog id="resultDialog">
    <p id="resultMessage"></p>
    <button id="closeButton">Close</button>
  </dialog>

  <!-- Scripts -->
  <script>
    var evTypep = window.performance.getEntriesByType("navigation")[0].type;
  
    if (evTypep == 'reload') {
      var confirmationMessage = 'Refreshing this page will take you to the example page. Do you want to proceed?';
      var userConfirmed = window.confirm(confirmationMessage);
  
      if (!userConfirmed) {
        window.addEventListener('beforeunload', function (e) {
          e.preventDefault();
        });
      } else {
        window.location.replace('deri_example2.html');
      }
    }
  </script>
 
  <script src="../static/script.js"></script>
</body>
</html>
