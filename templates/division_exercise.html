<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Division Exercise</title>
  
  <!-- Load CSS -->
  <link rel="stylesheet" type="text/css" href="../static/css/styles.css">

  <!-- MathJax Configuration  -->
  <script>
    MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']]
      },
      svg: {
        fontCache: 'global'
      }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <style>

    .page-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    .timer {
      font-size: 12px;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Logo Header (Moved out of the <head>) -->
  <div style="text-align: center; margin-top: 2%; margin-bottom: 2%;"> 
    <img src="../static/Logo.png" width="50%" alt="Logo" />
  </div>    

  <!-- Main Content -->
  <div class="page-container">  
    
    <h2 class="headingtop_margin">Exercises for Arithmetic</h2>
    
    <div class="exercise-box">
      <div class="timer" id="timer">
        <p>00:00:00</p>
      </div>
      <h4>Division</h4>

      <form id="exerciseForm">
        
        <!-- Question 1 -->
        <div id="Q1">
          <p class="line-spacing">Q1: 12 ÷ 6 = </p>
          <input type="radio" id="div1" name="q1" value="4">
          <label for="div1">4</label><br>
          <input type="radio" id="div2" name="q1" value="6">
          <label for="div2">6</label><br>
          <input type="radio" id="div3" name="q1" value="2">
          <label for="div3">2</label><br>
          <p style="font-size: 14px;" id="resultMessage_q1"></p>
          
          <button type="button" class="button gray" onclick="checkAnswer('q1', '2')">Check & Submit</button>
          <button type="button" class="button gray" id="submitButton1" onclick="showNextQuestionDiv('Q2', 'Q1')">Next Question</button>
        </div>

        <!-- Question 2 -->
        <div id="Q2" style="display: none;">
          <p class="line-spacing">Q2: 36 ÷ 9 = </p>
          <input type="radio" id="div4" name="q2" value="9">
          <label for="div4">9</label><br>
          <input type="radio" id="div5" name="q2" value="4">
          <label for="div5">4</label><br>
          <input type="radio" id="div6" name="q2" value="3">
          <label for="div6">3</label><br>
          <p style="font-size: 14px;" id="resultMessage_q2"></p>
          
          <button type="button" class="button gray" onclick="checkAnswer('q2', '4')">Check & Submit</button>
          <button type="button" class="button gray" id="submitButton2" onclick="showNextQuestionDiv('Q3', 'Q2')">Next Question</button>
        </div>

        <!-- Question 3 -->
        <div id="Q3" style="display: none;">
          <p class="line-spacing">Q3: 444 ÷ 12 = </p>
          <input type="radio" id="div7" name="q3" value="37">
          <label for="div7">37</label><br>
          <input type="radio" id="div8" name="q3" value="46">
          <label for="div8">46</label><br>
          <input type="radio" id="div9" name="q3" value="27">
          <label for="div9">27</label><br>
          <p style="font-size: 14px;" id="resultMessage_q3"></p>
          
          <button type="button" class="button gray" id="submitButton3" onclick="checkAnswer('q3', '37')">Check & Submit</button>
          <button type="submit" class="button gray" id="submitButton" onclick="checkAnswers(false)">Result</button>
          <br>
          <button type="button" class="button gray" id="exampleButton" disabled onclick="openPage('div_example.html')">Example</button>
          <button type="button" class="button gray" id="nextButton" onclick="openPage('algebra.html')" disabled>Next Chapter</button>
        </div>

      </form>
    </div>
    
    <div style="text-align: center; margin-top: 15px;"> 
      <p style="font-size:0.8em;">Note: You will get the final results based on your first attempt</p>
    </div>
  </div>

  <!-- Result Dialog -->
  <dialog id="resultDialog">
    <p id="resultMessage"></p>
    <button id="closeButton">Close</button>
  </dialog>

  <!-- Scripts -->
  <script>
    var evTypep = window.performance.getEntriesByType("navigation")[0].type;
  
    if (evTypep == 'reload') {
      var confirmationMessage = 'Refreshing this page will take you to the example page. Do you want to proceed?';
      var userConfirmed = window.confirm(confirmationMessage);
  
      if (!userConfirmed) {
        window.addEventListener('beforeunload', function (e) {
          e.preventDefault();
        });
      } else {
        window.location.replace('div_example.html');
      }
    }
  </script>
 
  <script src="../static/script.js"></script>
</body>
</html>
