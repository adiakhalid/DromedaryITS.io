<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Addition Exercise</title>
  
  <!-- Load CSS -->
  <link rel="stylesheet" type="text/css" href="../static/css/styles.css">

  <!-- MathJax Configuration  -->
  <script>
    MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']]
      },
      svg: {
        fontCache: 'global'
      }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <style>

    .page-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    .timer {
      font-size: 12px;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Logo Header -->
  <div style="text-align: center; margin-top: 2%; margin-bottom: 2%;"> 
    <img src="../static/Logo.png" width="50%" alt="Logo" />
  </div>

  <!-- Main Content Container -->
  <div class="page-container">  
    
    <h2 class="headingtop_margin">Exercises for Arithmetic</h2>
    
    <div class="exercise-box">
      <div class="timer" id="timer">
        <p>00:00:00</p>
      </div>
      <h4>Addition</h4>

      <form id="exerciseForm">
        
        <!-- Question 1 -->
        <div id="Q1">
          <p class="line-spacing">Q1: 23 + 5 = </p>
          <input type="radio" id="add1" name="q1" value="73">
          <label for="add1">73</label><br>
          <input type="radio" id="add2" name="q1" value="38">
          <label for="add2">38</label><br>
          <input type="radio" id="add3" name="q1" value="28">
          <label for="add3">28</label><br>
          <p style="font-size: 14px;" id="resultMessage_q1"></p>
          
          <button type="button" onclick="checkAnswer('q1', '28')" class="button gray">Check & Submit</button>
          <button type="button" id="submitButton1" onclick="showNextQuestionDiv('Q2', 'Q1')" class="button gray">Next Question</button>
        </div>

        <!-- Question 2 -->
        <div id="Q2" style="display: none;">
          <p class="line-spacing">Q2: 103 + 76 = </p>
          <input type="radio" id="add4" name="q2" value="179">
          <label for="add4">179</label><br>
          <input type="radio" id="add5" name="q2" value="180">
          <label for="add5">180</label><br>
          <input type="radio" id="add6" name="q2" value="181">
          <label for="add6">181</label><br>
          <p style="font-size: 14px;" id="resultMessage_q2"></p>
          
          <button type="button" onclick="checkAnswer('q2', '179')" class="button gray">Check & Submit</button>
          <button type="button" id="submitButton2" onclick="showNextQuestionDiv('Q3', 'Q2')" class="button gray">Next Question</button>
        </div>

        <!-- Question 3 -->
        <div id="Q3" style="display: none;">
          <p class="line-spacing">Q3: 359 + 167 = </p>
          <input type="radio" id="add7" name="q3" value="496">
          <label for="add7">496</label><br>
          <input type="radio" id="add8" name="q3" value="526">
          <label for="add8">526</label><br>
          <input type="radio" id="add9" name="q3" value="536">
          <label for="add9">536</label><br>
          <p style="font-size: 14px;" id="resultMessage_q3"></p>
        
          <button type="button" id="submitButton3" onclick="checkAnswer('q3', '526')" class="button gray">Check & Submit</button>
          
          <!-- This is the only submit button -->
          <button type="submit" id="submitButton" onclick="checkAnswers(false)" class="button gray">Result</button>
          <br>
          
          <button type="button" id="exampleButton" disabled onclick="openPage('add_example.html')" class="button gray">Example</button>
          <button class="button gray" type="button" id="nextButton" onclick="openPage('subtraction_exercise.html')" disabled>Next Exercise</button>
        </div>

      </form>
    </div>
    
    <div style="text-align: center; margin-top: 15px;"> 
      <p style="font-size:0.8em;">Note: You will get the final results based on your first attempt</p>
    </div>

  </div>

  <!-- Result Dialog -->
  <dialog id="resultDialog">
    <p id="resultMessage"></p>
    <button id="closeButton">Close</button>
  </dialog>

  <!-- Scripts -->
  <script>
    var evTypep = window.performance.getEntriesByType("navigation")[0].type;
  
    if (evTypep == 'reload') {
      var confirmationMessage = 'Refreshing this page will take you to the example page. Do you want to proceed?';
      var userConfirmed = window.confirm(confirmationMessage);
  
      if (!userConfirmed) {
        window.addEventListener('beforeunload', function (e) {
          e.preventDefault();
        });
      } else {
        window.location.replace('add_example.html');
      }
    }
  </script>
 
  <script src="../static/script.js"></script>
</body>
</html>
